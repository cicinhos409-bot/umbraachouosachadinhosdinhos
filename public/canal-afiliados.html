<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal Afiliados - Painel</title>
<meta name="description" content="Painel web do Canal Afiliados: as mesmas configurações e fluxos do painel do Telegram.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ee4d2d'/%3E%3Cpath d='M26 20l20 12-20 12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/painel.css">
<style>
  .bot { white-space: pre-line; overflow-wrap: anywhere; }
  .ok { color: var(--ok); font-size: 14px; margin: 6px 0 0; white-space: pre-line; }
  .err { white-space: pre-line; }
  .sub { margin-top: 12px; }
  .fila-linha { margin: 0 0 10px; overflow-wrap: anywhere; }
  .fila-linha small { display: block; color: var(--muted); }
  .divisoria { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .menu-grid .full { grid-column: 1 / -1; }
  .lista-num { margin: 0; padding: 0; list-style: none; overflow-wrap: anywhere; }
  .lista-num li { padding: 4px 0; }
  textarea.legenda { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  @media (max-width: 420px) { .menu-grid .full { grid-column: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="topo"></div>
  <h1>📺 Canal Afiliados</h1>
  <p class="lead">Postagens do canal principal, fila de vídeos e configurações avançadas: os mesmos botões e fluxos do painel do Telegram.</p>
  <a class="voltar" id="voltar" href="#" hidden>🔙 Voltar</a>
  <div id="tela" aria-live="polite"></div>
</div>
<script src="/assets/painel.js"></script>
<script>
(function () {
  "use strict";
  var $ = Painel.$, esc = Painel.esc;

  /* ===== Estado (só neste navegador) ===== */
  var PADRAO = {
    contador: 1,
    fila: [],                       // {id, legenda, data, prioridade, postado}
    rotina: {                       // padrões de ler_config_rotina (canal principal)
      bom_dia: { inicio: 6, fim: 9, frequencia: 1 },
      incentivo: { inicio: 10, fim: 20, frequencia: 2 },
      boa_noite: { inicio: 21, fim: 23, frequencia: 1 },
      link_grupo: { inicio: 9, fim: 21, frequencia: 3 },
      divulgar_gem: { inicio: 8, fim: 22, frequencia: 1 },
      promo_viral: { inicio: 10, fim: 20, frequencia: 1 },
      promo_publico: { inicio: 10, fim: 20, frequencia: 1 },
      promo_achadinhos: { inicio: 10, fim: 20, frequencia: 1 },
      pausado: false
    },
    spam: { alvos: [], frequencia: 0, repeticoes: 6, replicas: 5, pausado: false, config_alvos: {} },
    pausa: { ativa: false, data_retorno: null, servicos_pausados: [] },
    sim: { bomDia: false, boaNoite: false },   // o que o servidor saberia: Bom Dia / Boa Noite de hoje já saíram
    fluxo: null                                // Criar Postagem em andamento
  };
  var S = Painel.estado("canal-afiliados", PADRAO);
  function ler() { return S.ler(); }
  function alt(fn) { return S.alterar(fn); }

  var NOMES_ROTINA = {
    bom_dia: "Bom Dia ☀️", boa_noite: "Boa Noite 🌙", incentivo: "Incentivo 🔥", link_grupo: "Convite do Grupo 🔗",
    divulgar_gem: "Prompt GEM 🤖", promo_viral: "Convite do Grupo Viral 🚀", promo_publico: "Promo Público 🗣️",
    promo_achadinhos: "Achadinhos VIP 🛍️"
  };
  var ORDEM_ROTINA = ["bom_dia", "incentivo", "link_grupo", "divulgar_gem", "promo_viral", "promo_publico", "promo_achadinhos", "boa_noite"];
  var EDITAR_ROTINA = [
    ["Editar Bom Dia ☀️", "bom_dia"], ["Editar Incentivo 🔥", "incentivo"],
    ["Editar Convite 🔗", "link_grupo"], ["Editar Prompt GEM 🤖", "divulgar_gem"],
    ["Editar Convite Viral 🚀", "promo_viral"], ["Editar Promo Público 🗣️", "promo_publico"],
    ["Editar Achadinhos 🛍️", "promo_achadinhos"], ["Editar Boa Noite 🌙", "boa_noite"]
  ];

  /* ===== Datas no horário de Brasília ===== */
  function agoraBR() {
    var p = {};
    new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour, mi: +p.minute };
  }
  function z(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(o) { return o.y + "-" + z(o.m) + "-" + z(o.d); }
  function somaDias(s, n) {
    var a = s.split("-"), d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2] + n));
    return d.getUTCFullYear() + "-" + z(d.getUTCMonth() + 1) + "-" + z(d.getUTCDate());
  }
  function brData(s) { var a = s.split("-"); return a[2] + "/" + a[1] + "/" + a[0]; }
  function brCurta(s) { var a = s.split("-"); return a[2] + "/" + a[1]; }
  var DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  function diaSemana(s) { var a = s.split("-"); return DIAS[new Date(Date.UTC(+a[0], +a[1] - 1, +a[2])).getUTCDay()]; }
  function hoje() { return ymd(agoraBR()); }
  function amanha() { return somaDias(hoje(), 1); }
  function ehHoje(d) { return d === "2000-01-01" || d <= hoje(); }
  function rotuloData(d) {
    if (ehHoje(d)) return "Hoje 🟢";
    if (d === amanha()) return "Amanhã 🟡";
    return brData(d) + " 🔵";
  }

  /* ===== Texto da fila ===== */
  function resumo(leg) { return String(leg || "").replace(/<[^>]+>/g, "").split("\n")[0] || "Vídeo sem descrição"; }
  function ordenar(f) {
    return f.map(function (x, i) { return [x, i]; }).sort(function (a, b) {
      if (a[0].data !== b[0].data) return a[0].data < b[0].data ? -1 : 1;
      if (a[0].prioridade !== b[0].prioridade) return a[0].prioridade - b[0].prioridade;
      return a[1] - b[1];
    }).map(function (x) { return x[0]; });
  }
  function tamanho(s) { return Array.from(s).length; }   // conta como o Telegram (caracteres, não pares UTF-16)
  function menorNumero(f, ids) {
    var menor = Infinity;
    ids.forEach(function (id) {
      var it = f.filter(function (x) { return x.id === id; })[0];
      var m = it && /vídeo\s+(\d+)/i.exec(it.legenda);
      if (m && +m[1] < menor) menor = +m[1];
    });
    return menor;
  }
  // Mesma regra de aplicar_renumeracao_e_salvar: grava a ordem (prioridade) e renumera "Vídeo N" em sequência.
  function renumerar(d, ids, base) {
    var n = base != null ? base : menorNumero(d.fila, ids);
    if (n === Infinity) n = d.contador;
    ids.forEach(function (id, i) {
      var it = d.fila.filter(function (x) { return x.id === id; })[0];
      if (!it) return;
      it.legenda = it.legenda.replace(/(vídeo\s+)\d+/i, function (_, a) { return a + n; });
      it.prioridade = i + 1;
      n++;
    });
    d.contador = n;
    d.fila = ordenar(d.fila);
  }

  /* ===== Mensagens e navegação ===== */
  var MSG = null;            // {t, ok}
  var PZ = null;             // fluxo da pausa programada (em memória, como o FSM do bot)
  var FL = null;             // fluxo aberto em Gerenciar Fila
  var CFG = null;            // fluxo aberto nas configurações (rotina, spam, número)
  var RECIBO = null;
  function dizer(t, ok) { MSG = { t: t, ok: !!ok }; }
  function blocoMsg() {
    if (!MSG) return '<div role="alert" class="err"></div>';
    return MSG.ok ? '<p class="ok" role="status">' + esc(MSG.t) + "</p>" : '<p class="err" role="alert">' + esc(MSG.t) + "</p>";
  }
  function voltar(h, rot) { var a = $("voltar"); a.hidden = !h; a.setAttribute("href", h || "#"); a.textContent = rot || "🔙 Voltar"; }
  function ir(h) { if (location.hash === h) render(); else location.hash = h; }
  function resetarFluxos() { MSG = null; PZ = null; FL = null; CFG = null; RECIBO = null; }

  var ACT = {}, FORM = {};
  function btn(act, rot, extra, cls, arg) {
    return '<button type="button" data-act="' + act + '"' + (arg != null ? ' data-arg="' + esc(arg) + '"' : "") +
      (cls ? ' class="' + cls + '"' : "") + ">" + esc(rot) + "</button>";
  }
  function campo(id, rotulo, inner) { return '<div class="field"><label for="' + id + '">' + rotulo + "</label>" + inner + "</div>"; }

  /* ================================================================
     Menu do Canal Afiliados (obter_teclado_principal)
     ================================================================ */
  function vMenu() {
    voltar(null);
    var d = ler();
    return '<div class="card"><p class="bot" style="margin-top:0"><b>📺 Menu do Canal Afiliados</b>\nGerencie as postagens e rotinas abaixo:</p>' +
      '<div class="menu-grid"><a class="btn" href="#criar">Criar Postagem 📝</a><a class="btn" href="#fila">Gerenciar Fila 📋</a>' +
      '<a class="btn full" href="#config">🛠️ Configurações Avançadas</a></div></div>' +
      '<details class="card sub"><summary>Simulação do servidor (só no protótipo)</summary>' +
      '<p class="hint">O robô sabe se o Bom Dia e a Boa Noite de hoje já saíram. Aqui você diz isso à mão, para ver o efeito na fila (data dos novos vídeos), nos disparos manuais e em Mover Posição.</p>' +
      '<div class="switch"><label for="sim-bd" style="margin:0">O Bom Dia de hoje já saiu</label><input type="checkbox" id="sim-bd" data-sim="bomDia"' + (d.sim.bomDia ? " checked" : "") + "></div>" +
      '<div class="switch"><label for="sim-bn" style="margin:0">A Boa Noite de hoje já saiu</label><input type="checkbox" id="sim-bn" data-sim="boaNoite"' + (d.sim.boaNoite ? " checked" : "") + "></div></details>";
  }

  /* ================================================================
     Criar Postagem 📝 (PostagemFluxo)
     ================================================================ */
  function fluxoNovo() { return { passo: "video", fala: "Excelente! Envie o vídeo do produto e eu criarei a legenda de vendas para você.", links_shopee: [], links_tiktok: [] }; }
  function setFluxo(fn) { alt(function (d) { if (!d.fluxo) d.fluxo = fluxoNovo(); fn(d.fluxo, d); }); }

  function vCriar() {
    voltar("#", "🔙 Voltar ao menu do Canal Afiliados");
    var d = ler(), f = d.fluxo, h = "";
    if (RECIBO) {
      h += '<div class="card"><p class="bot" style="margin:0">' + RECIBO + "</p></div>" +
        '<div class="actions"><button type="button" class="primary full" data-act="novaPostagem">Criar Postagem 📝</button></div>';
      return h;
    }
    if (!f) {
      f = fluxoNovo();
      alt(function (x) { x.fluxo = f; });
    }
    h += '<div class="card"><p class="bot" style="margin-top:0">' + esc(f.fala) + "</p>";
    var p = f.passo;
    if (p === "video") {
      h += campo("in-video", "Vídeo do produto", '<input type="file" id="in-video" accept="video/*">') +
        '<p class="hint">O vídeo fica só neste navegador (nada é enviado). Tamanho máximo de 20MB, o limite do Telegram para bots.</p>' +
        '<div class="actions"><button type="button" class="primary" data-act="enviarVideo">Enviar vídeo</button>' + btn("cancelarPost", "Cancelar ❌") + "</div>" +
        '<p class="err" role="alert">' + (MSG ? esc(MSG.t) : "") + "</p>";
    } else if (p === "erro") {
      h += '<div class="actions">' + btn("tentarDeNovo", "Tentar Novamente 🔄") + btn("manualErro", "Digitar Manualmente ✍️") + btn("cancelarPost", "Cancelar ❌", null, "full") + "</div>" +
        '<p class="hint">Protótipo: a análise do vídeo pela IA só roda no servidor. Para ver a tela de aprovação do nome:</p>' +
        '<div class="actions">' + btn("exemploIA", "Ver a aprovação com um nome de exemplo", null, "full") + "</div>";
    } else if (p === "confirmar") {
      h += '<div class="actions">' + btn("aprovarNome", "Aprovar ✅", null, "primary") + btn("digitarNome", "Digitar Nome ✍️") + btn("cancelarPost", "Cancelar ❌", null, "full") + "</div>";
    } else if (p === "manual") {
      h += '<form data-form="nomeManual" novalidate>' + campo("in-nome", "Nome do produto", '<input type="text" id="in-nome" autocomplete="off">') +
        '<div class="actions"><button type="submit" class="primary">Salvar nome</button>' + btn("cancelarPost", "Cancelar ❌") + "</div></form>" +
        '<p class="err" role="alert">' + (MSG ? esc(MSG.t) : "") + "</p>";
    } else if (p === "plataforma") {
      h += '<div class="actions">' + btn("plat", "Ambos 🛒🎵", null, "full", "Ambos 🛒🎵") + btn("plat", "Apenas Shopee 🛒", null, "", "Apenas Shopee 🛒") +
        btn("plat", "Apenas TikTok 🎵", null, "", "Apenas TikTok 🎵") + btn("cancelarPost", "Cancelar ❌", null, "full") + "</div>";
    } else if (p === "link_video_shopee" || p === "link_video_tiktok") {
      h += '<form data-form="linkVideo" novalidate>' + campo("in-link", "Link do vídeo", '<input type="text" id="in-link" autocomplete="off" placeholder="https://...">') +
        '<div class="actions"><button type="submit" class="primary">Salvar link</button>' + btn("cancelarPost", "Cancelar ❌") + "</div></form>";
    } else if (p === "links_shopee" || p === "links_tiktok") {
      h += '<form data-form="linkProduto" novalidate>' + campo("in-link", "Link do produto", '<input type="text" id="in-link" autocomplete="off" placeholder="https://...">') +
        '<div class="actions"><button type="submit" class="primary">Adicionar link</button>' + btn("finalizarLinks", "Finalizar ✅") + btn("cancelarPost", "Cancelar ❌", null, "full") + "</div></form>";
    }
    h += "</div>";
    return h;
  }

  ACT.novaPostagem = function () { RECIBO = null; MSG = null; alt(function (d) { d.fluxo = null; }); render(); };
  ACT.enviarVideo = function () {
    var inp = $("in-video"), file = inp && inp.files && inp.files[0];
    if (!file || !/^video\//.test(file.type || "")) {
      dizer("Por favor, envie um arquivo de vídeo."); render(); return;
    }
    MSG = null;
    var grande = file.size > 20 * 1024 * 1024;
    alt(function (d) {
      var f = d.fluxo;
      f.numero = d.contador;                  // reserva o número já na entrada (o Cancelar devolve)
      d.contador = d.contador + 1;
      f.video = file.name;
      f.passo = "erro";
      f.origemErro = true;
      f.fala = "⚠️ A IA não conseguiu processar este vídeo.\nMotivo: " +
        (grande ? "O vídeo ultrapassa o limite de 20MB do Telegram para Bots." : "No protótipo a análise do vídeo pela IA não está disponível (só roda no servidor).") +
        "\n\nO que você deseja fazer agora?";
    });
    render();
  };
  ACT.tentarDeNovo = function () { Painel.soServidor("Tentar Novamente 🔄"); };
  ACT.manualErro = function () {
    setFluxo(function (f) { f.passo = "manual"; f.vindo = "erro"; f.fala = "Sem problemas. Digite manualmente APENAS O NOME DO PRODUTO ou kit:"; }); render();
  };
  ACT.exemploIA = function () {
    setFluxo(function (f) {
      f.nome = "Vídeo " + f.numero + "\n📦 Item: Kit de exemplo (exemplo)";
      f.passo = "confirmar";
      f.fala = f.nome + "\n\n👉 Esta identificação está correta? Escolha uma opção abaixo:";
    }); render();
  };
  ACT.aprovarNome = function () {
    setFluxo(function (f) { f.passo = "plataforma"; f.fala = "Onde você postou/vai postar este vídeo?"; }); render();
  };
  ACT.digitarNome = function () {
    setFluxo(function (f) { f.passo = "manual"; f.vindo = "confirmar"; f.fala = "Sem problemas. Digite manualmente APENAS O NOME DO PRODUTO:"; }); render();
  };
  FORM.nomeManual = function () {
    var t = $("in-nome").value.trim();
    if (!t) { dizer("Digite o nome do produto."); render(); return; }
    MSG = null;
    setFluxo(function (f) {
      f.nome = "Vídeo " + f.numero + "\n📦 Item: " + t;
      f.passo = "plataforma";
      f.fala = "Identificação salva como:\n\n" + f.nome + "\n\nOnde você postou/vai postar este vídeo?";
    }); render();
  };
  ACT.plat = function (b) {
    var p = b.dataset.arg;
    setFluxo(function (f) {
      f.plataforma = p; f.links_shopee = []; f.links_tiktok = [];
      if (p === "Ambos 🛒🎵" || p === "Apenas Shopee 🛒") {
        f.passo = "link_video_shopee"; f.fala = "Certo! Agora envie o Link do Vídeo que você postou na SHOPEE.";
      } else {
        f.passo = "link_video_tiktok"; f.fala = "Certo! Agora envie o Link do Vídeo que você postou no TIKTOK.";
      }
    }); render();
  };
  FORM.linkVideo = function () {
    var t = $("in-link").value.trim();
    if (!t) { return; }
    setFluxo(function (f) {
      if (f.passo === "link_video_shopee") {
        f.link_video_shopee = t; f.passo = "links_shopee";
        f.fala = "Link do vídeo da Shopee salvo! 🛒\n\nAgora, envie os links dos produtos da SHOPEE um por um. Clique em 'Finalizar' quando terminar.";
      } else {
        f.link_video_tiktok = t; f.passo = "links_tiktok";
        f.fala = "Link do vídeo do TikTok salvo! 🎵\n\nAgora, envie os links dos produtos do TIKTOK um por um. Clique em 'Finalizar' quando acabar.";
      }
    }); render();
  };
  function depoisShopee(f, auto) {
    if (f.plataforma === "Ambos 🛒🎵") {
      f.passo = "link_video_tiktok";
      f.fala = (auto ? "Link Shopee 6/6 registrado.\nLimite atingido, avançando para a próxima etapa...\n\n" : "") +
        "Links da Shopee salvos! 🛒\n\nAgora, envie o Link do Vídeo que você postou no TIKTOK.";
      return false;
    }
    return true;
  }
  FORM.linkProduto = function () {
    var t = $("in-link").value.trim();
    if (!t) { return; }
    var fim = false;
    setFluxo(function (f) {
      var tik = f.passo === "links_tiktok", lista = tik ? f.links_tiktok : f.links_shopee, nome = tik ? "TikTok" : "Shopee";
      lista.push(t);
      if (lista.length >= 6) {
        if (tik) { f.fala = "Link TikTok 6/6 registrado.\nLimite atingido, finalizando a postagem..."; fim = true; }
        else { fim = depoisShopee(f, true); }
      } else {
        f.fala = "Link " + nome + " " + lista.length + "/6 registrado. Envie o próximo ou clique em Finalizar.";
      }
    });
    if (fim) concluir(); else render();
  };
  ACT.finalizarLinks = function () {
    var fim = false;
    setFluxo(function (f) {
      if (f.passo === "links_tiktok") fim = true;
      else fim = depoisShopee(f, false);
    });
    if (fim) concluir(); else render();
  };
  ACT.cancelarPost = function () {
    alt(function (d) {
      var f = d.fluxo;
      if (f && f.numero != null && d.contador === f.numero + 1) d.contador = f.numero;   // devolve o número reservado
      d.fluxo = null;
    });
    resetarFluxos();
    dizer("Ação cancelada e memória limpa. Voltando ao menu...", true);
    ir("#");
  };

  // finalizar_postagem: monta a legenda (3 níveis, 1024 caracteres) e põe o vídeo na fila.
  function concluir() {
    var d0 = ler(), f = d0.fluxo, plat = f.plataforma;
    var titulo = f.nome.replace(/\n/g, " | ");
    var DIV = "━━━━━━━━━━━━━━━";
    var cab = "<b>" + titulo + "</b>\n\n" + DIV + "\n\n";
    var longo = "<i>(💡 O nosso grupo é 100% gratuito. Para nos ajudar a continuar trazendo conteúdos, por favor, clique no link do vídeo acima, assista, curta, comente e siga o perfil! Isso nos ajuda muito!)</i>\n\n";
    var curto = "<i>(💡 Grupo 100% gratuito. Curta e comente nos vídeos para ajudar!)</i>\n\n";
    var rodape = "\n<i>(💡 Grupo 100% gratuito. Curta e comente nos vídeos para ajudar!)</i>";
    function montar(apoio, isRodape, alvo) {
      var p = alvo || plat, t = cab, i;
      if (p === "Ambos 🛒🎵" || p === "Apenas Shopee 🛒") {
        t += "🔶 <b>SHOPEE VÍDEO</b> 🔶\n\n🎬 Link do Vídeo:\n" + (f.link_video_shopee || "") + "\n";
        if (!isRodape) t += apoio;
        if (f.links_shopee.length) { t += "🔗 Links dos Produtos:\n"; for (i = 0; i < f.links_shopee.length; i++) t += "👉 " + (i + 1) + "º: " + f.links_shopee[i] + "\n"; }
        t += p === "Ambos 🛒🎵" ? "\n" + DIV + "\n\n" : "\n";
      }
      if (p === "Ambos 🛒🎵" || p === "Apenas TikTok 🎵") {
        t += "⬛ <b>TIKTOK</b> ⬛\n\n🎬 Link do Vídeo:\n" + (f.link_video_tiktok || "") + "\n";
        if (!isRodape) t += apoio;
        if (f.links_tiktok.length) { t += "🔗 Links dos Produtos:\n"; for (i = 0; i < f.links_tiktok.length; i++) t += "👉 " + (i + 1) + "º: " + f.links_tiktok[i] + "\n"; }
        t += "\n";
      }

  function normalizarAlvo(entrada) {
    var s = String(entrada).trim(), base = s, topico = null, m;
    if (!s) return null;
    if (s.indexOf("t.me/c/") >= 0) {
      var p = s.split("t.me/c/")[1].split("/"); base = "-100" + p[0]; if (p.length > 1 && /^\d+$/.test(p[1])) topico = p[1];
    } else if (s.indexOf("t.me/") >= 0) {
      var q = s.split("t.me/")[1].split("/"); base = "@" + q[0]; if (q.length > 1 && /^\d+$/.test(q[1])) topico = q[1];
    } else if (s.indexOf("web.telegram.org") >= 0 && s.indexOf("#") >= 0) {
      var w = s.split("#")[1].split("/")[0];
      if (w.indexOf("_") >= 0) { var pw = w.split("_"); base = pw[0]; if (/^\d+$/.test(pw[1])) topico = pw[1]; } else base = w;
    } else if (s.indexOf("_") >= 0 && s.indexOf("http") < 0) {
      m = /^(-?\d+)_(\d+)$/.exec(s); if (m) { base = m[1]; topico = m[2]; }
    } else if (s.indexOf(":") >= 0 && s.indexOf("http") < 0) {
      var c = s.split(":"); base = c[0]; if (c.length > 1 && /^\d+$/.test(c[1])) topico = c[1];
    } else if (s.indexOf("/") >= 0 && s.indexOf("http") < 0) {
      var b2 = s.split("/"); base = b2[0]; if (b2.length > 1 && /^\d+$/.test(b2[1])) topico = b2[1];
    }
    base = base.trim();
    if (!(/^-?\d+$/.test(base) || /^@[A-Za-z][A-Za-z0-9_]{3,}$/.test(base))) return null;

  FORM.pzData = function () {
    var m = /^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2})$/.exec($("in-ret").value.trim());
    function erro(t) { MSG = { t: t, ok: false }; $("pz-err").textContent = t; }
    if (!m) { erro("Formato inválido. Use DD/MM HH:MM, como por exemplo: 29/05 15:00."); return; }
    var dia = +m[1], mes = +m[2], hora = +m[3], min = +m[4], n = agoraBR(), ano = n.y;
    function valido(a) {
      if (mes < 1 || mes > 12 || hora > 23 || min > 59 || dia < 1) return false;
      var dt = new Date(Date.UTC(a, mes - 1, dia)); return dt.getUTCMonth() === mes - 1 && dt.getUTCDate() === dia;
    }
    function chave(a) { return ((a * 100 + mes) * 100 + dia) * 10000 + hora * 100 + min; }
    var agoraK = ((n.y * 100 + n.m) * 100 + n.d) * 10000 + n.h * 100 + n.mi;
    if (!valido(ano)) { erro("Data ou hora inexistente. Tente novamente:"); return; }
    if (chave(ano) <= agoraK) {
      if (mes < n.m) { ano = ano + 1; if (!valido(ano)) { erro("Data ou hora inexistente. Tente novamente:"); return; } }
      else { erro("A data e hora de retorno devem estar no futuro. Tente novamente:"); return; }
    }
    MSG = null;
    var retorno = z(dia) + "/" + z(mes) + "/" + ano + " " + z(hora) + ":" + z(min), d = ler();
    var spamAtivo = !d.spam.pausado, rotAtiva = !d.rotina.pausado;
    PZ = { passo: "servicos", retorno: retorno };
    if (!spamAtivo && !rotAtiva) PZ.selecao = "Nenhum (Apenas Avisos)";
    else if (spamAtivo && rotAtiva) PZ.opcoes = ["Pausar Ambos", "Apenas SPAM", "Apenas Rotina"];
    else if (spamAtivo) PZ.opcoes = ["Pausar SPAM"];
    else PZ.opcoes = ["Pausar Rotina"];
    render();
  };
  ACT.pzServico = function (b) { PZ.selecao = b.dataset.arg; PZ.passo = "confirmar"; render(); };
  ACT.pzConfirmar = function () {
    var sel = PZ.selecao || "", ret = PZ.retorno, serv = [];
    alt(function (d) {
      if (["Pausar Ambos", "Apenas SPAM", "Pausar SPAM"].indexOf(sel) >= 0) { d.spam.pausado = true; serv.push("spam"); }
      if (["Pausar Ambos", "Apenas Rotina", "Pausar Rotina"].indexOf(sel) >= 0) { d.rotina.pausado = true; serv.push("rotina"); }
      d.pausa = { ativa: true, data_retorno: ret, servicos_pausados: serv };
    });
    PZ = null;
    dizer("🛑 Pausa Configurada com Sucesso!\nA pausa ficou registrada aqui. O aviso gerado pela IA no grupo, a parada dos vídeos de hoje e o despertar automático na data marcada só acontecem no servidor.", true);
    render();
  };
  ACT.pzFim = function () {
    Painel.confirmar("⚠️ Tem certeza de que deseja encerrar a pausa agora, recalcular a fila e acordar o robô imediatamente?", function () {
      alt(function (d) {
        var s = d.pausa.servicos_pausados || [];
        if (s.indexOf("spam") >= 0) d.spam.pausado = false;
        if (s.indexOf("rotina") >= 0) d.rotina.pausado = false;
        d.pausa.ativa = false; d.pausa.servicos_pausados = [];
      });
      dizer("▶️ Pausa programada encerrada! Serviços reativados aqui. A mensagem de retorno da IA no grupo, a troca do aviso antigo e o recálculo da fila só acontecem no servidor.", true);
      render();
    });
  };

  /* ---------- Zerar Filas e Tarefas 🧹 ---------- */
  function vZerar() {
    voltar("#config", "🔙 Voltar às Configs");
    var t = '<div class="card"><p class="bot" style="margin-top:0">🧹 <b>CENTRAL DE LIMPEZA DO SERVIDOR</b>\n\nEscolha qual módulo você deseja esvaziar. As suas configurações do robô (textos, horários, alvos) <b>nunca</b> são apagadas.\n\n🛡️ <i>Nota: A Fila Principal (SQLite) está protegida e nunca será apagada por este menu.</i>\n\n' +
      "👉 <b>Fila Espião:</b> Apaga clones retidos no radar e exclui os arquivos de vídeo do servidor.\n👉 <b>Fila Espelhador:</b> Apaga a repassagem de vídeos pendentes e seus respectivos arquivos.\n👉 <b>Fila Autorais:</b> Apaga os vídeos de retorno pendentes no banco de dados e arquivos físicos.\n👉 <b>Geral:</b> Esvazia o Espião, Espelhador, Autorais, apaga o lixo temporário, exclui backups e limpa logs do Ubuntu.</p>" +
      '<div class="menu-grid">' + btn("limpar", "Limpar Tudo (Geral) 💥", null, "full", "Limpar Tudo (Geral) 💥") + btn("limpar", "Limpar Fila do Espião 🕵️", null, "", "Limpar Fila do Espião 🕵️") +
      btn("limpar", "Limpar Fila Espelhador 🔄", null, "", "Limpar Fila Espelhador 🔄") + btn("limpar", "Limpar Fila Autorais 🎥", null, "", "Limpar Fila Autorais 🎥") +
      '<a class="btn" href="#config">Voltar ao Menu Anterior 🔙</a></div></div>';
    return t;
  }
  ACT.limpar = function (b) {
    var r = b.dataset.arg;
    Painel.confirmar("⚠️ Atenção: Você está prestes a executar a operação: " + r + ".\n\nEsta ação apagará arquivos físicos e limpará a fila selecionada. Deseja continuar? (Aprovar Exclusão ✅)",
      function () { Painel.soServidor(r); });
  };

  /* ================================================================
     Roteamento
     ================================================================ */
  var VISTAS = {
    "": vMenu, criar: vCriar, fila: vFila, config: vConfig, "config-rotina": vRotina, "config-rotina-editar": vRotinaEditar,
    "config-rotina-disparos": vDisparos, "config-spam": vSpam, "config-numero": vNumero, "config-pausa": vPausa, "config-zerar": vZerar
  };
  var vistaAtual = null;
  function render() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!VISTAS[h]) h = "";
    if (vistaAtual !== null && vistaAtual !== h) {
      // Como os botões do bot: sair de uma tela cancela o fluxo dela.
      var msgKeep = MSG;
      resetarFluxos();
      if (vistaAtual === "criar") alt(function (d) { d.fluxo = null; });
      MSG = msgKeep && msgKeep.keep ? msgKeep : null;
    }
    if (h !== "criar") RECIBO = null;
    vistaAtual = h;
    $("tela").innerHTML = VISTAS[h]();
    if (h === "criar" && RECIBO == null) { /* nada */ }
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  $("tela").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
  });
  $("tela").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target.closest("form[data-form]");
    if (f && FORM[f.dataset.form]) FORM[f.dataset.form](f);
  });
  $("tela").addEventListener("change", function (e) {
    var c = e.target.closest("[data-sim]");
    if (c) alt(function (d) { d.sim[c.dataset.sim] = c.checked; });
  });

  Painel.topo("canal-afiliados");
  // Criar Postagem em andamento só continua se a tela ainda for a dela.
  if ((location.hash || "") !== "#criar") alt(function (d) { d.fluxo = null; });
  render();
})();
</script>
